    label: US Board on Geographic Names
  - date: 2019-08
    label: AP Stylebook adopts Kyiv
  - date: 2019-10
    label: BBC adopts Kyiv
  - date: 2022-02
    label: Battle of Kyiv begins
  - date: 2022-10
    label: Massive missile strikes on Kyiv
