  match_mode: word_boundary
  slug: feodosiia
- category: historical
  russian: Olga of Kiev
  ukrainian: Olha of Kyiv
  enabled: true
  is_control: false
  notes: Princess of Kyivan Rus (княгиня Ольга). Tests Г→H in first name + Kiev→Kyiv.
  match_mode: exact_phrase
  slug: olha-of-kyiv
- category: people
  russian: Igor Sikorsky
  ukrainian: Ihor Sikorsky
  enabled: true
  is_control: false
  notes: Aviation pioneer (Ігор Сікорський). Tests І→I and Г→H (Igor vs Ihor).
  match_mode: exact_phrase
  slug: ihor-sikorsky
- category: people
  russian: Sergei Korolev
  ukrainian: Serhii Korolyov
  enabled: true
  is_control: false
  notes: Chief rocket engineer of the Soviet space program (Сергій Корольов), born
    in Zhytomyr, Ukraine. English almost universally uses the Russian form. One of
    the most consequential cases of Ukrainian identity erasure in global science history.
  match_mode: exact_phrase
  slug: serhii-korolyov
- category: historical
  russian: Bogdan Khmelnitsky
  ukrainian: Bohdan Khmelnytskyi
  enabled: true
  is_control: false
  notes: Hetman (Богдан Хмельницький). Tests Г→H (Bogdan vs Bohdan) and suffix (-itsky
    vs -ytskyi).
  match_mode: exact_phrase
  slug: bohdan-khmelnytskyi
- category: people
  russian: Kazimir Malevich
  ukrainian: Kazymyr Malevych
  enabled: true
  is_control: false
  notes: Suprematist artist (Казимир Малевич). Tests И→Y and Ч→Ch (Malevich vs Malevych).
  match_mode: exact_phrase
  slug: kazymyr-malevych
