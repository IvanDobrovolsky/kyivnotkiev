  ukrainian: Donbas
  enabled: true
  is_control: false
  notes: Politically charged — Russia insists on "Donbass", Ukraine on "Donbas". Part
    of the 7,800 toponyms renamed across 83 Ukrainian cities since 2022 (Transparent
    Cities). July 2023 law mandated renaming of Russian imperial toponyms.
  events:
  - date: 2014-04
    label: Donbas conflict begins
  - date: 2022-02
    label: Full-scale invasion
  - date: 2023-07
    label: Toponym decolonization law
  match_mode: word_boundary
  slug: donbas
