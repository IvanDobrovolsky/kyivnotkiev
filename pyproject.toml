[project]
name = "kyivnotkiev"
version = "2.1.0"
description = "Multi-source computational analysis of Ukrainian name-transliteration adoption in English (2010-2025)"
requires-python = ">=3.11"
# Regenerated 2026-09-02 from actual imports across pipeline/ (ast scan).
# The old requirements.txt (April pins, pre-restructure) is retired — this
# file is the single dependency manifest.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "trafilatura>=1.8",
    "langdetect>=1.0.9",
    "zstandard>=0.22",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "ruptures>=1.1",
    "hdbscan>=0.8",
    "umap-learn>=0.5",
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
    "fasttext-wheel>=0.9",
    "datasets>=2.19",
    "huggingface-hub>=0.23",
    "anthropic>=0.30",
    "openai>=1.30",
    "telethon>=1.35",          # telegram ingestion (source deprecated; code retained)
    "google-cloud-bigquery>=3.20",   # legacy gdelt_mentions path
]
